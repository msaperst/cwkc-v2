# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    # Never publish a manually-dispatched feature branch.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout approved main code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # A code merge cannot reset a live scoreboard to the zeroed main CSV.
      # During prelaunch before data-branch bootstrap, main's CSV is safe.
      - name: Overlay published results (never stale main data after kickoff)
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin cwkc-results >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/cwkc-results:refs/remotes/origin/cwkc-results
            python -m scraper.scoreboard_snapshot restore
          else
            python -m scraper.scoreboard_snapshot require-prelaunch
          fi
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './public'  # Upload public folder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
