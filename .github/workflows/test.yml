name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          pip install pytest pytest-cov coverage

      - name: Run tests
        run: |
          set -o pipefail
          pytest --cov=scraper --cov-report=xml --cov-report=term-missing --cov-report=html scraper/tests --maxfail=1 --disable-warnings -q | tee coverage.txt
          
          start_line=$(grep -n "^Name" coverage.txt | cut -d: -f1 | head -n 1)
          if [ -n "$start_line" ]; then
            tail -n +"$start_line" coverage.txt > coverage_summary.txt
          else
            echo "⚠️ Coverage summary header not found" > coverage_summary.txt
          fi
          
          echo "COVERAGE_OUTPUT<<EOF" >> $GITHUB_ENV
          cat coverage_summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload coverage summary to PR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage-html
          path: htmlcov/
          retention-days: 7

      - name: Upload Python coverage.xml
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: python-code-coverage-report
          message: |
            ### 🧪 Python Code Coverage Summary
            ```
            ${{ env.COVERAGE_OUTPUT }}
            ```
            
            ✅ [View full coverage report (artifact)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          append: false

  javascript-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci

      - name: Run tests
        run: |
          set -o pipefail
          npm test | tee coverage.txt
          
          start_line=$(grep -n "^----------|" coverage.txt | cut -d: -f1 | head -n 1)
          if [ -n "$start_line" ]; then
            tail -n +"$start_line" coverage.txt > coverage_summary.txt
          else
            echo "⚠️ Coverage summary header not found" > coverage_summary.txt
          fi
          
          echo "COVERAGE_OUTPUT<<EOF" >> $GITHUB_ENV
          cat coverage_summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Upload coverage summary to PR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-coverage-html
          path: coverage/
          retention-days: 7

      - name: Upload JS lcov.info
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: javascript-code-coverage-report
          message: |
            ### 🧪 Javascript Code Coverage Summary
            ```
            ${{ env.COVERAGE_OUTPUT }}
            ```
            
            ✅ [View full coverage report (artifact)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          append: false

  sonarcloud:
    runs-on: ubuntu-latest
    needs:
      - python-test
      - javascript-test

    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node (for scanner internal deps)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Python (if scanner needs to detect local environment)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12

      - name: Download python coverage.xml
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-coverage-xml
          path: .

      - name: Fix Python coverage paths for SonarCloud
        run: |
          sed -i -E 's|<source>[^<]*/scraper</source>|<source>scraper</source>|g' coverage.xml

      - name: Download JS lcov.info
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: javascript-coverage-lcov
          path: coverage

      - name: Set up Java 21 for SonarQube scanner
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # The old sonarcloud-github-action@v2 uses an unsupported Java 17 image.
      # Official SonarQube Cloud action executes with the supported Java runtime.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Use the Java 21 runtime configured above rather than the scanner's
          # extra JRE metadata/download endpoint.
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: 'true'
        with:
          projectBaseDir: .

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 15
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}