# Manual, isolated integration test. Never reads real email or modifies live results.
name: Rehearse CWKC email to website (sandbox)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "offline: in-memory Sheet; sandbox: real dedicated test Google Sheet"
        type: choice
        options:
          - offline
          - sandbox
        default: offline
        required: true

permissions:
  contents: read

concurrency:
  group: cwkc-e2e-rehearsal
  cancel-in-progress: false

jobs:
  e2e:
    # Production credentials cannot run code from an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install hash-verified Python dependencies
        env:
          PIP_NO_DEPS: 'true'
          PIP_ONLY_BINARY: ':all:'
        run: python -m pip install --require-hashes -r scraper/requirements-ci.lock

      - name: Prepare sandbox Sheets credential file only if requested
        if: inputs.mode == 'sandbox'
        env:
          GOOGLE_TYPE: ${{ secrets.TYPE }}
          GOOGLE_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_AUTH_URI: ${{ secrets.AUTH_URI }}
          GOOGLE_TOKEN_URI: ${{ secrets.TOKEN_URI }}
          GOOGLE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          GOOGLE_CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
          GOOGLE_UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fields = ("type", "project_id", "private_key_id", "private_key",
                    "client_email", "client_id", "auth_uri", "token_uri",
                    "auth_provider_x509_cert_url", "client_x509_cert_url")
          missing = [k for k in fields if not os.getenv("GOOGLE_" + k.upper())]
          if missing:
              raise SystemExit("Missing Google service-account secrets")
          credentials = {k: os.environ["GOOGLE_" + k.upper()] for k in fields}
          credentials["private_key"] = credentials["private_key"].replace("\\n", "\n")
          if os.getenv("GOOGLE_UNIVERSE_DOMAIN"):
              credentials["universe_domain"] = os.environ["GOOGLE_UNIVERSE_DOMAIN"]
          file = Path("spreadsheet_credentials.json")
          file.write_text(json.dumps(credentials), encoding="utf-8")
          file.chmod(0o600)
          PY

      - name: Rehearse offline using fake Google Sheets (no secrets)
        if: inputs.mode == 'offline'
        run: python -m scraper.tests.e2e_rehearsal --mode offline

      - name: Rehearse writes to designated sandbox Google Sheet
        if: inputs.mode == 'sandbox'
        env:
          CWKC_E2E_SPREADSHEET_KEY: ${{ secrets.CWKC_E2E_SPREADSHEET_KEY }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: python -m scraper.tests.e2e_rehearsal --mode sandbox

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked JavaScript packages and Chromium
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install chromium

      - name: Render exact Python-generated CSV in desktop and mobile browsers
        env:
          CI: 'true'
        run: ./node_modules/.bin/playwright test e2e/full-pipeline.spec.cjs

      # All artifacts are synthetic and unrelated to actual donors.
      - name: Upload synthetic CSV and rehearsal summary
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwkc-synthetic-e2e-${{ github.run_id }}
          path: |
            .cwkc-e2e-results.csv
            .cwkc-e2e-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cwkc-e2e-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
