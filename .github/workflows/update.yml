# Update the public CSV from both LGL and Google Forms after an approved dispatch.
# Every event recomputes BOTH sources in sequence, because GitHub concurrency
# may coalesce pending dispatches and independent CSV writers can overwrite data.
name: Update results from multiple locations

on:
  repository_dispatch:
    types: [sheet-change, lgl-form-submission]
  workflow_dispatch:

# Never cancel a run that may already be processing an LGL email.
# Coalesced events remain safe: every allowed run refreshes all sources.
concurrency:
  group: cwkc-results-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      in_range: ${{ steps.gate.outputs.in_range }}
    steps:
      - name: Checkout gate and tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check 2026 competition window and dispatch type
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}
        run: python -m scraper.season

  update_results:
    runs-on: ubuntu-latest
    needs: check_date
    if: ${{ needs.check_date.outputs.in_range == 'true' }}
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      # This must be the latest MAIN, not the commit that happened to trigger
      # the dispatch. Multiple inputs must always start with the same CSV.
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Workers can wait in the GitHub runner queue after the first gate.
      # Recheck BEFORE reading Gmail or Sheets so a delayed job cannot start
      # ingestion once the official competition window has closed.
      - name: Verify cutoff before ingestion
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}
        run: python -m scraper.season --verify-only

      - name: Install hash-verified Python dependencies
        env:
          PIP_NO_DEPS: 'true'
          PIP_ONLY_BINARY: ':all:'
        run: python -m pip install --require-hashes -r scraper/requirements-ci.lock

      # Secrets are passed as environment variables, not interpolated into
      # shell code, and the JSON is written without printing sensitive data.
      - name: Configure Google Sheets credentials
        env:
          GOOGLE_TYPE: ${{ secrets.TYPE }}
          GOOGLE_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_AUTH_URI: ${{ secrets.AUTH_URI }}
          GOOGLE_TOKEN_URI: ${{ secrets.TOKEN_URI }}
          GOOGLE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          GOOGLE_CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
          GOOGLE_UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = ("type", "project_id", "private_key_id", "private_key",
                  "client_email", "client_id", "auth_uri", "token_uri",
                  "auth_provider_x509_cert_url", "client_x509_cert_url",
                  "universe_domain")
          data = {key: os.environ.get(f"GOOGLE_{key.upper()}", "") for key in keys}
          if any(not data[key] for key in keys):
              raise SystemExit("Missing Google service-account secrets")
          data["private_key"] = data["private_key"].replace("\\n", "\n")
          # LGL runs from repo root; Google Forms script runs from scraper/.
          for path in (Path("spreadsheet_credentials.json"),
                       Path("scraper/spreadsheet_credentials.json")):
              path.write_text(json.dumps(data), encoding="utf-8")
              path.chmod(0o600)
          PY

      - name: Process unread LGL emails and calculate donation scores
        env:
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: python -m scraper.getLglFormData

      - name: Update Google Forms participation scores
        working-directory: scraper
        run: python getGoogleFormData.py

      # A long-running import must not publish after the official closing time.
      - name: Check cutoff again before publishing
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_ACTION: ${{ github.event.action || '' }}
        run: python -m scraper.season --verify-only

      - name: Detect changed scoreboard
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/assets/csv/results.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [[ "$code" -ne 1 ]]; then
              echo "git diff failed with exit code $code" >&2
              exit "$code"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Upload BEFORE committing, so an artifact failure never leaves a new
      # CSV commit with no available artifact for Pages publication.
      - name: Save changed CSV for Pages
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-csv-${{ github.run_id }}
          path: public/assets/csv/results.csv
          if-no-files-found: error
          retention-days: 7

      # As with the existing workflow, this is an automated DATA commit, not
      # a direct human source-code push. Branch rules must explicitly permit it.
      - name: Commit and publish changed results
        if: ${{ steps.changes.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/csv/results.csv
          git commit -m "Update CWKC results"
          git push origin HEAD:main

  deploy_site:
    runs-on: ubuntu-latest
    needs: [check_date, update_results]
    if: ${{ needs.check_date.outputs.in_range == 'true' && needs.update_results.result == 'success' && needs.update_results.outputs.changed == 'true' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Retrieve this run's updated CSV
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: results-csv-${{ github.run_id }}
          path: public/assets/csv
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: './public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
