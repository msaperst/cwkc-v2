# Recompute BOTH sources in a single run. Concurrent dispatches are coalesced,
# so every run must be able to reconstruct the complete latest scoreboard.
name: Update results from multiple locations

on:
  repository_dispatch:
    types: [sheet-change, lgl-form-submission]
  workflow_dispatch:
  # GitHub cron is UTC. Tick at :02/:07/.../:57 (off the busy hour),
  # with a best-effort last pre-cutoff tick at 00:59 UTC on Dec 8.
  # Year-independent cron is guarded by season.json and the kill switch.
  schedule:
    - cron: '2-59/5 * 30 11 *'
    - cron: '2-59/5 * 1-8 12 *'
    - cron: '59 0 8 12 *'

# Allow an in-flight run to finish, never cancel while it can acknowledge email.
concurrency:
  group: updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-window:
    # workflow_dispatch on another branch must never change production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CWKC_INGESTION_ENABLED: ${{ vars.CWKC_INGESTION_ENABLED }}
    outputs:
      active: ${{ steps.season.outputs.active }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check exact configured Eastern-time window
        id: season
        run: python -m scraper.contest_window

  recompute:
    needs: check-window
    env:
      CWKC_INGESTION_ENABLED: ${{ vars.CWKC_INGESTION_ENABLED }}
    if: needs.check-window.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install hash-verified Python dependencies
        env:
          PIP_NO_DEPS: 'true'
          PIP_ONLY_BINARY: ':all:'
        run: python -m pip install --require-hashes -r scraper/requirements-ci.lock

      # Re-check after any time spent queued or installing. This runs before
      # any credentials are read, emails acknowledged or Sheets updated.
      - name: Reject ingestion after cutoff
        run: python -m scraper.contest_window --require-active

      # main holds code; live score data is maintained on cwkc-results.
      # Missing branch or schema disagreement fails before any mail is read.
      - name: Restore last published scoreboard
        run: |
          git fetch --no-tags origin refs/heads/cwkc-results:refs/remotes/origin/cwkc-results
          python -m scraper.scoreboard_snapshot restore --backup "$RUNNER_TEMP/cwkc-previous-results.csv"

      - name: Write private Google service account files
        env:
          GOOGLE_TYPE: ${{ secrets.TYPE }}
          GOOGLE_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_AUTH_URI: ${{ secrets.AUTH_URI }}
          GOOGLE_TOKEN_URI: ${{ secrets.TOKEN_URI }}
          GOOGLE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          GOOGLE_CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
          GOOGLE_UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          fields = ("type", "project_id", "private_key_id", "private_key",
                    "client_email", "client_id", "auth_uri", "token_uri",
                    "auth_provider_x509_cert_url", "client_x509_cert_url")
          missing = [key for key in fields if not os.environ.get("GOOGLE_" + key.upper())]
          if missing:
              raise SystemExit("Missing configured Google service-account secret fields")
          credentials = {key: os.environ["GOOGLE_" + key.upper()] for key in fields}
          credentials["private_key"] = credentials["private_key"].replace("\\n", "\n")
          if os.environ.get("GOOGLE_UNIVERSE_DOMAIN"):
              credentials["universe_domain"] = os.environ["GOOGLE_UNIVERSE_DOMAIN"]
          for filename in (Path("spreadsheet_credentials.json"),
                           Path("scraper/spreadsheet_credentials.json")):
              filename.write_text(json.dumps(credentials), encoding="utf-8")
              filename.chmod(0o600)
          PY

      # Both producers are executed every time: a queued dispatch can be
      # superseded by GitHub's concurrency scheduler without missing its source.
      # Do not publish if either source fails.
      - name: Update donation totals from unread LGL email
        env:
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: python -m scraper.getLglFormData

      - name: Update gathering and participation totals
        working-directory: scraper
        run: python getGoogleFormData.py

      # The import can span the closing instant; never publish afterwards.
      - name: Reject publication after cutoff
        run: python -m scraper.contest_window --require-active

      - name: Compare computed CSV with published snapshot
        id: changes
        shell: bash
        run: |
          if cmp -s "$RUNNER_TEMP/cwkc-previous-results.csv" public/assets/csv/results.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Save a per-run copy before the commit, so an artifact failure cannot
      # leave a data commit without a matching deployment artifact.
      - name: Save reconciled CSV for Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-csv-${{ github.run_id }}
          path: public/assets/csv/results.csv
          if-no-files-found: error
          retention-days: 7

      # Do not bypass main protection for bot-written data. Worktree lets
      # the scripts and code stay on main while only the CSV is committed.
      - name: Commit reconciled scoreboard to data branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch --no-tags origin refs/heads/cwkc-results:refs/remotes/origin/cwkc-results
          git worktree add --detach "$RUNNER_TEMP/cwkc-published" origin/cwkc-results
          cp public/assets/csv/results.csv "$RUNNER_TEMP/cwkc-published/public/assets/csv/results.csv"
          git -C "$RUNNER_TEMP/cwkc-published" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/cwkc-published" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/cwkc-published" add -- public/assets/csv/results.csv
          git -C "$RUNNER_TEMP/cwkc-published" diff --cached --check
          git -C "$RUNNER_TEMP/cwkc-published" commit -m "Update CWKC results"
          git -C "$RUNNER_TEMP/cwkc-published" push origin HEAD:cwkc-results

  deploy-results:
    needs: recompute
    if: needs.recompute.result == 'success' && needs.recompute.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Share deployment concurrency with deploy.yml so manual PR merges and
    # results publishing cannot deploy Pages at the same time.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GITHUB_TOKEN pushes do NOT trigger deploy.yml; deploy here explicitly.
      - name: Checkout published main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Retrieve this run's reconciled CSV
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: results-csv-${{ github.run_id }}
          path: public/assets/csv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
