name: Sync approved photos

on:
  repository_dispatch:
    types: [sheet-change]
  workflow_dispatch:
  schedule:
    # Fallback if a form-submit or manual edit dispatch is missed.
    - cron: '13,28,43,58 * 30 11 *'
    - cron: '13,28,43,58 * 1-8 12 *'
    - cron: '13 12 * * *'

concurrency:
  group: cwkc-photo-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && vars.CWKC_PHOTOS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified dependencies
        env:
          PIP_NO_DEPS: 'true'
          PIP_ONLY_BINARY: ':all:'
        run: python -m pip install --require-hashes -r scraper/requirements-ci.lock
      - name: Generate approved gallery
        env:
          GOOGLE_TYPE: ${{ secrets.TYPE }}
          GOOGLE_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          GOOGLE_PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.CLIENT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GOOGLE_AUTH_URI: ${{ secrets.AUTH_URI }}
          GOOGLE_TOKEN_URI: ${{ secrets.TOKEN_URI }}
          GOOGLE_AUTH_PROVIDER_X509_CERT_URL: ${{ secrets.AUTH_PROVIDER_X509_CERT_URL }}
          GOOGLE_CLIENT_X509_CERT_URL: ${{ secrets.CLIENT_X509_CERT_URL }}
          GOOGLE_UNIVERSE_DOMAIN: ${{ secrets.UNIVERSE_DOMAIN }}
        shell: bash
        run: |
          credentials="$RUNNER_TEMP/cwkc-photo-credentials.json"
          trap 'rm -f "$credentials"' EXIT
          umask 077
          python - "$credentials" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          fields = ("type", "project_id", "private_key_id", "private_key",
                    "client_email", "client_id", "auth_uri", "token_uri",
                    "auth_provider_x509_cert_url", "client_x509_cert_url")
          if any(not os.environ.get("GOOGLE_" + key.upper()) for key in fields):
              raise SystemExit("Missing configured Google service-account secret fields")
          data = {key: os.environ["GOOGLE_" + key.upper()] for key in fields}
          data["private_key"] = data["private_key"].replace("\\n", "\n")
          if os.environ.get("GOOGLE_UNIVERSE_DOMAIN"):
              data["universe_domain"] = os.environ["GOOGLE_UNIVERSE_DOMAIN"]
          Path(sys.argv[1]).write_text(json.dumps(data), encoding="utf-8")
          PY
          python -m scraper.getPhotos --credentials-file "$credentials" --output "$RUNNER_TEMP/cwkc-gallery"

      - name: Publish only approved photo assets
        id: publish
        shell: bash
        run: |
          target="$RUNNER_TEMP/cwkc-photo-worktree"
          if git ls-remote --exit-code --heads origin refs/heads/cwkc-photos >/dev/null; then
            git fetch --no-tags origin refs/heads/cwkc-photos:refs/remotes/origin/cwkc-photos
            git worktree add --detach "$target" origin/cwkc-photos
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach "$target" HEAD
          fi
          rm -rf "$target/public/assets/photos"
          mkdir -p "$target/public/assets/photos"
          cp -a "$RUNNER_TEMP/cwkc-gallery/." "$target/public/assets/photos/"
          git -C "$target" config user.name "github-actions[bot]"
          git -C "$target" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target" add -A -- public/assets/photos
          if git -C "$target" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$target" diff --cached --check
          git -C "$target" commit -m "Update approved CWKC photos"
          git -C "$target" push origin HEAD:cwkc-photos
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.result == 'success' && (needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
